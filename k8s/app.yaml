apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-library
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-library
  template:
    metadata:
      labels:
        app: online-library
    spec:
      containers:
        - name: online-library
          image: online-library-management:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: library-db
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: library_user
            - name: DB_NAME
              value: library_db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-db-secret
                  key: MYSQL_PASSWORD
            - name: ADMIN_USERNAME
              value: admin
            - name: ADMIN_PASSWORD
              value: admin123
---
apiVersion: v1
kind: Service
metadata:
  name: online-library
spec:
  type: NodePort
  selector:
    app: online-library
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080